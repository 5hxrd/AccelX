[package]
name = "accelx-keygen"
version = "0.1.0"
edition = "2021"
description = "AccelX license key generator (seller only - never ship this)"

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }

[profile.release]
opt-level = "s"
strip = true
