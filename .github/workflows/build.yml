name: Build AccelX

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: bun install

      - name: Build frontend
        run: bun run build:tauri

      - name: Build AccelX.exe
        run: bun run tauri build

      - name: Build key generator (seller tool)
        run: cargo build --release --manifest-path tools/keygen/Cargo.toml

      - name: Collect exe
        shell: bash
        run: |
          mkdir out keygen-out
          cp src-tauri/target/release/accelx.exe out/AccelX.exe
          cp tools/keygen/target/release/accelx-keygen.exe keygen-out/accelx-keygen.exe

      - uses: actions/upload-artifact@v4
        with:
          name: AccelX-windows
          path: out/AccelX.exe

      - uses: actions/upload-artifact@v4
        with:
          name: AccelX-keygen
          path: keygen-out/accelx-keygen.exe

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/AccelX.exe
